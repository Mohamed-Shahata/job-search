services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
      - db
    env_file:
      - .env.development

  redis:
    image: redis:latest
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:latest
    ports:
      - '5432:5432'
    env_file:
      - .env.development
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  redisdata:
  pgdata:
